<div class="pix-card">
  <header class="pix-card-header">
    <div class="pix-icon-wrapper">
      <span class="pix-icon">❖</span>
    </div>
    <h2>Pix Transfer</h2>
    <p class="pix-card-desc">Transferência bancária instantânea</p>
  </header>

  <form (submit)="confirm($event)" class="pix-form">
    <div class="form-field">
      <label for="pixKey" class="form-label">Pix Key</label>
      <input
        type="text"
        id="pixKey"
        name="pixKey"
        class="form-input"
        placeholder="CPF, e-mail, telefone ou chave aleatória"
        [value]="pixKey()"
        (input)="updatePixKey($event)"
        required
      />
    </div>

    <div class="form-field">
      <label for="amount" class="form-label">Amount</label>
      <input
        type="number"
        id="amount"
        name="amount"
        class="form-input"
        placeholder="0.00"
        step="0.01"
        min="0.01"
        [value]="amount()"
        (input)="updateAmount($event)"
        required
      />
    </div>

    <div class="form-field">
      <label for="scheduledDate" class="form-label">Scheduled Date</label>
      <input
        type="date"
        id="scheduledDate"
        name="scheduledDate"
        class="form-input"
        [value]="scheduledDate()"
        (input)="updateScheduledDate($event)"
        required
      />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-confirm" [disabled]="!isFormValid()">Confirm</button>
    </div>
  </form>

  @if (isConfirmed()) {
    <section class="confirmed-section">
      <div class="confirmed-badge">✓</div>
      <h3>Transfer Confirmed</h3>
      <div class="receipt">
        <p>Pix Key: {{ pixKey() }}</p>
        <p>Amount: {{ amount() }}</p>
        <p>Scheduled Date: {{ scheduledDate() }}</p>
      </div>
    </section>
  }
</div>
