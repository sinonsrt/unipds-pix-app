<h2>Pix Transfer</h2>

<form (submit)="confirm($event)">
  <div>
    <label for="pixKey">Pix Key</label>
    <input
      type="text"
      id="pixKey"
      name="pixKey"
      [value]="pixKey()"
      (input)="updatePixKey($event)"
      required
    />
  </div>

  <div>
    <label for="amount">Amount</label>
    <input
      type="number"
      id="amount"
      name="amount"
      step="0.01"
      min="0.01"
      [value]="amount()"
      (input)="updateAmount($event)"
      required
    />
  </div>

  <div>
    <label for="scheduledDate">Scheduled Date</label>
    <input
      type="date"
      id="scheduledDate"
      name="scheduledDate"
      [value]="scheduledDate()"
      (input)="updateScheduledDate($event)"
      required
    />
  </div>

  <div>
    <button type="submit">Confirm</button>
  </div>
</form>

@if (isConfirmed()) {
  <section>
    <h3>Transfer Confirmed</h3>
    <p>Pix Key: {{ pixKey() }}</p>
    <p>Amount: {{ amount() }}</p>
    <p>Scheduled Date: {{ scheduledDate() }}</p>
  </section>
}
